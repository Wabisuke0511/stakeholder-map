<!DOCTYPE html>
<html lang="ja" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stakeholder Map</title>
<style>
:root {
  --navy: #1E2761;
  --orange: #E8A33D;
  --bg: #f8f9fc;
  --white: #ffffff;
  --border: #dde1ea;
  --text: #2c3148;
  --text-light: #6b7280;
  --promote: #2E7D5B;
  --neutral: #9AA3B2;
  --resist: #B0413E;
  --q1-bg: rgba(46,125,91,0.07);
  --q2-bg: rgba(232,163,61,0.07);
  --q3-bg: rgba(30,39,97,0.05);
  --q4-bg: rgba(176,65,62,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

/* Header */
.header { background: var(--navy); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.05em; flex-shrink: 0; }
.header-sub { font-size: 12px; color: rgba(255,255,255,0.7); flex-shrink: 0; }
.privacy-note { font-size: 10px; color: rgba(255,255,255,0.55); flex-shrink: 0; }

/* Language switcher */
.lang-switcher { display: flex; gap: 4px; margin-left: auto; }
.lang-btn { background: transparent; border: 1px solid rgba(255,255,255,0.35); color: rgba(255,255,255,0.65); border-radius: 4px; padding: 3px 8px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
.lang-btn.active { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.85); font-weight: 700; }
.lang-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }

/* Control bar */
.controls { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.control-group { display: flex; align-items: center; gap: 8px; }
.control-group label { font-size: 12px; color: var(--text-light); white-space: nowrap; }
select { border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 13px; color: var(--text); background: var(--white); cursor: pointer; }
input[type=range] { width: 140px; accent-color: var(--navy); cursor: pointer; }
.snapshot-label { font-size: 12px; color: var(--navy); font-weight: 600; min-width: 80px; }
.trail-check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.trail-check input { accent-color: var(--navy); width: 15px; height: 15px; cursor: pointer; }
.btn { background: var(--orange); color: white; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
.btn:hover { opacity: 0.85; }
.btn-sm { background: var(--navy); font-size: 11px; padding: 4px 10px; }
.btn-danger { background: #c0392b; font-size: 11px; padding: 4px 10px; }

/* Main layout */
.main { display: flex; gap: 0; flex-wrap: wrap; }
.map-section { flex: 1 1 460px; max-width: 640px; padding: 16px; min-width: 0; }
.side-section { width: 360px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--white); display: flex; flex-direction: column; height: 600px; }
@media (max-width: 900px) {
  .side-section { width: 100%; border-left: none; border-top: 1px solid var(--border); height: auto; }
}

/* SVG map */
.map-container { position: relative; background: var(--white); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.map-container svg { display: block; width: 100%; height: auto; max-width: 608px; }

/* Side panel */
.side-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.side-header h2 { font-size: 13px; font-weight: 700; color: var(--navy); }
.table-scroll { overflow-x: auto; overflow-y: auto; flex: 1; min-height: 0; }
@media (max-width: 900px) { .table-scroll { max-height: 44vh; flex: none; } }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #f3f4f8; padding: 8px 10px; text-align: left; font-weight: 600; color: var(--text-light); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid #eef0f5; vertical-align: middle; }
tr:hover td { background: #f8f9fc; }
td select { font-size: 11px; padding: 2px 4px; border-radius: 3px; }
.attitude-btn { border: none; border-radius: 3px; padding: 3px 8px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.1s; }
.attitude-btn:hover { opacity: 0.8; }
.att-推進 { background: rgba(46,125,91,0.15); color: var(--promote); }
.att-中立 { background: rgba(154,163,178,0.2); color: #555; }
.att-抵抗 { background: rgba(176,65,62,0.15); color: var(--resist); }
.change-indicator { font-size: 13px; font-weight: 700; margin-right: 2px; }
.change-up { color: var(--promote); }
.change-down { color: var(--resist); }
.change-neutral { color: var(--neutral); }
.add-row { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.add-row input { flex: 1; min-width: 100px; border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; }

/* ========== Mobile overrides (≤ 600px) ========== */
@media (max-width: 600px) {
  /* Header */
  .header { padding: 10px 14px; gap: 8px; }
  .header h1 { font-size: 14px; }
  .header-sub { display: none; }
  .privacy-note { font-size: 9px; }
  .lang-btn { font-size: 10px; padding: 2px 6px; }

  /* Controls: stack into 2 rows */
  .controls { padding: 8px 12px; gap: 8px; }
  .control-group { width: 100%; }
  .control-group label { font-size: 11px; min-width: 72px; }
  #snapshotSelect { flex: 1; font-size: 12px; }
  input[type=range] { flex: 1; width: auto; }
  .snapshot-label { font-size: 11px; min-width: 56px; }
  .trail-check { font-size: 12px; }
  .btn { font-size: 12px; padding: 6px 12px; }
  .btn-sm { font-size: 10px; padding: 4px 8px; }

  /* Map section */
  .map-section { padding: 10px 10px 6px; }

  /* Side panel */
  .side-header { padding: 10px 12px; }
  .side-header h2 { font-size: 12px; }
  .table-scroll { max-height: 42vh; }

  /* Table: touch-friendly sizes */
  th { padding: 8px 8px; font-size: 11px; }
  td { padding: 8px 8px; }
  td select { font-size: 13px; padding: 4px 5px; min-height: 32px; }
  .attitude-btn { padding: 6px 10px; font-size: 12px; min-height: 32px; }
  .btn-danger { padding: 5px 8px; font-size: 11px; }

  /* Add row */
  .add-row { padding: 8px 12px; gap: 6px; }
  .add-row input { font-size: 13px; padding: 7px 8px; }

  /* Summary */
  .summary { padding: 12px 14px; }
  .summary-grid { grid-template-columns: 1fr; }
}

/* Summary */
.summary { border-top: 1px solid var(--border); background: var(--white); padding: 16px 20px; }
.summary h2 { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.summary-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; }
.summary-card h3 { font-size: 11px; font-weight: 600; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.summary-card .stat { font-size: 22px; font-weight: 700; color: var(--navy); }
.attitude-bars { display: flex; flex-direction: column; gap: 4px; }
.att-bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.att-bar-row span:first-child { width: 30px; color: var(--text-light); }
.att-bar-bg { flex: 1; height: 8px; background: #eef0f5; border-radius: 4px; overflow: hidden; }
.att-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.att-bar-count { width: 20px; text-align: right; font-weight: 600; }
.diff-text { font-size: 12px; color: var(--text-light); }
.diff-item { margin-top: 4px; }
.diff-pos { color: var(--promote); font-weight: 600; }
.diff-neg { color: var(--resist); font-weight: 600; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.hidden { display: none; }
.modal { background: white; border-radius: 8px; padding: 24px; width: 380px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal h2 { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.modal-field input { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; font-size: 13px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn-cancel { background: #eef0f5; color: var(--text); border: none; border-radius: 4px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
.tooltip { position: fixed; background: rgba(30,39,97,0.92); color: white; border-radius: 5px; padding: 6px 10px; font-size: 12px; pointer-events: none; z-index: 50; white-space: nowrap; transition: opacity 0.1s; }
</style>
</head>

<div id="js-error" style="display:none;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;"></div>
<div class="header">
  <h1 id="app-title">ステークホルダーマップ</h1>
  <span class="header-sub" id="app-subtitle">組織変革 推進状況の可視化</span>
  <span class="privacy-note" id="app-privacy">🔒 すべてのデータはこのブラウザ内にのみ保存されます。外部通信なし。</span>
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-ja" onclick="setLang('ja')">日本語</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-zh" onclick="setLang('zh')">中文</button>
    <button class="lang-btn" id="btn-de" onclick="setLang('de')">DE</button>
  </div>
</div>

<div class="controls">
  <div class="control-group">
    <label id="lbl-snapshot">スナップショット</label>
    <select id="snapshotSelect"></select>
  </div>
  <div class="control-group">
    <label id="lbl-timeline">タイムライン</label>
    <input type="range" id="timelineSlider" min="0" max="0" value="0" step="1">
    <span class="snapshot-label" id="sliderLabel"></span>
  </div>
  <label class="trail-check">
    <input type="checkbox" id="trailCheck"> <span id="lbl-trail">軌跡を表示</span>
  </label>
  <button class="btn" id="newSnapshotBtn">＋ 新しいスナップショット</button>
</div>

<div class="main">
  <div class="map-section">
    <div class="map-container" id="mapContainer">
      <svg id="mapSvg" viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div class="side-section">
    <div class="side-header">
      <h2 id="sideTitle">ステークホルダー一覧</h2>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" id="deleteSnapshotBtn">このスナップショットを削除</button>
      </div>
    </div>
    <div class="table-scroll">
      <table id="stakeholderTable">
        <thead>
          <tr>
            <th id="th-change">変化</th>
            <th id="th-name">群名</th>
            <th id="th-dept">部門</th>
            <th id="th-impact">Impact</th>
            <th id="th-influence">Influence</th>
            <th id="th-attitude">態度</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="add-row">
      <input id="newName" placeholder="群名 ※個人名は入力しないでください" style="flex:2">
      <input id="newDept" placeholder="部門" style="flex:1">
      <button class="btn btn-sm" id="addStakeholderBtn">追加</button>
    </div>
  </div>
</div>

<div class="summary" id="summarySection">
  <h2 id="summary-title">サマリー</h2>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<!-- New snapshot modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2 id="modal-title">新しいスナップショットを作成</h2>
    <div class="modal-field">
      <label id="modal-date-lbl">日付</label>
      <input type="date" id="modalDate">
    </div>
    <div class="modal-field">
      <label id="modal-label-lbl">ラベル（例：設計フェーズ完了）</label>
      <input type="text" id="modalLabel" placeholder="ラベルを入力">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">キャンセル</button>
      <button class="btn" id="modalCreate">作成</button>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip hidden" id="tooltip"></div>

function t(key) {

  return (v !== undefined) ? v : key;

var state = { stakeholders: [], snapshots: [], currentSnapIndex: 0, showTrail: false, lang: 'ja' };

var STORAGE_KEY = 'stakeholder-map-v1';

function storageGet() {
  try { var v = localStorage.getItem(STORAGE_KEY); if (v) return v; } catch(e) {}
  try { return sessionStorage.getItem(STORAGE_KEY); } catch(e) {}
  return null;
}
function storageSet(val) {
  try { localStorage.setItem(STORAGE_KEY, val); return; } catch(e) {}
  try { sessionStorage.setItem(STORAGE_KEY, val); } catch(e) {}
}

function loadState() {
  try {
    var raw = storageGet();
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.stakeholders && parsed.stakeholders.length > 0
          && parsed.snapshots && parsed.snapshots.length > 0) {
        state = parsed;
        currentLang = state.lang || 'ja';
        return;
      }
    }
  } catch(e) {}
  state = {
    stakeholders: JSON.parse(JSON.stringify(INITIAL_STAKEHOLDERS)),
    snapshots: JSON.parse(JSON.stringify(INITIAL_SNAPSHOTS)),
    currentSnapIndex: 0,
    showTrail: false,
    lang: 'ja'
  };
  saveState();
}

function saveState() {
  try { state.lang = currentLang; storageSet(JSON.stringify(state)); } catch(e) {}
}

function currentSnap() { return state.snapshots[state.currentSnapIndex]; }
function prevSnap() { return state.currentSnapIndex > 0 ? state.snapshots[state.currentSnapIndex - 1] : null; }

function getEntry(snap, sid) {
  if (!snap) return null;
  for (var i = 0; i < snap.entries.length; i++) {
    if (snap.entries[i].stakeholderId === sid) return snap.entries[i];
  }
  return null;
}

// ============================================================
// SVG MAP — cell sub-grid positioning
// ============================================================
var SVG_W = 560, SVG_H = 460;
var MARGIN = { top: 28, right: 18, bottom: 46, left: 52 };
var PLOT_W = SVG_W - MARGIN.left - MARGIN.right;
var PLOT_H = SVG_H - MARGIN.top - MARGIN.bottom;

function getSubOffsets(n) {
  var S = 26;
  if (n <= 1) return [{dx:0, dy:0}];
  if (n === 2) return [{dx:-S*0.5, dy:0}, {dx:S*0.5, dy:0}];
  if (n === 3) return [
    {dx:0, dy:-S*0.6},
    {dx:-S*0.56, dy:S*0.4},
    {dx: S*0.56, dy:S*0.4}
  ];
  if (n === 4) return [
    {dx:-S*0.5, dy:-S*0.5}, {dx:S*0.5, dy:-S*0.5},
    {dx:-S*0.5, dy: S*0.5}, {dx:S*0.5, dy: S*0.5}
  ];
  return Array.from({length:n}, function(_, i) {
    var a = (i/n)*2*Math.PI - Math.PI/2;
    return {dx: Math.cos(a)*S*0.8, dy: Math.sin(a)*S*0.8};
  });
}

function computeSnapPositions(snap) {
  if (!snap) return {};
  var cellW = PLOT_W / 3;
  var cellH = PLOT_H / 3;
  var cellGroups = {};
  snap.entries.forEach(function(e) {
    var key = e.influence + '_' + e.impact;
    if (!cellGroups[key]) cellGroups[key] = [];
    cellGroups[key].push(e);
  });
  Object.values(cellGroups).forEach(function(g) {
    g.sort(function(a, b) { return a.stakeholderId.localeCompare(b.stakeholderId); });
  });
  var positions = {};
  Object.entries(cellGroups).forEach(function(kv) {
    var key = kv[0], group = kv[1];
    var parts = key.split('_').map(Number);
    var inf = parts[0], imp = parts[1];
    var cx = MARGIN.left + (inf - 1) * cellW + cellW / 2;
    var cy = MARGIN.top  + (3 - imp) * cellH + cellH / 2;
    var offsets = getSubOffsets(group.length);
    group.forEach(function(e, i) {
      positions[e.stakeholderId] = {
        x: cx + offsets[i].dx,
        y: cy + offsets[i].dy,
        dx: offsets[i].dx
      };
    });
  });
  return positions;
}

function svgEl(tag, attrs) {
  var el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.keys(attrs).forEach(function(k) { el.setAttribute(k, attrs[k]); });
  return el;
}

function renderMap() {
  var svg = document.getElementById('mapSvg');
  svg.innerHTML = '';

  var snap = currentSnap();
  if (!snap) return;

  var quads = [
    { x: MARGIN.left + PLOT_W/2, y: MARGIN.top,            w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q1-bg)', label: t('q1') },
    { x: MARGIN.left + PLOT_W/2, y: MARGIN.top + PLOT_H/2, w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q2-bg)', label: t('q2') },
    { x: MARGIN.left,            y: MARGIN.top,            w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q3-bg)', label: t('q3') },
    { x: MARGIN.left,            y: MARGIN.top + PLOT_H/2, w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q4-bg)', label: t('q4') },
  ];
  quads.forEach(function(q) {
    svg.appendChild(svgEl('rect', { x:q.x, y:q.y, width:q.w, height:q.h, fill:q.fill }));
    var tEl = svgEl('text', { x: q.x + q.w/2, y: q.y + 18, 'text-anchor':'middle', fill:'#aab0c4', 'font-size':'12', 'font-weight':'600', 'pointer-events':'none' });
    tEl.textContent = q.label;
    svg.appendChild(tEl);
  });

  // Grid lines
  for (var i = 1; i <= 2; i++) {
    var x = MARGIN.left + (PLOT_W / 3) * i;
    svg.appendChild(svgEl('line', { x1:x, y1:MARGIN.top, x2:x, y2:MARGIN.top+PLOT_H, stroke:'#d0d4e0', 'stroke-width':'1', 'stroke-dasharray':'4,4' }));
    var y = MARGIN.top + (PLOT_H / 3) * i;
    svg.appendChild(svgEl('line', { x1:MARGIN.left, y1:y, x2:MARGIN.left+PLOT_W, y2:y, stroke:'#d0d4e0', 'stroke-width':'1', 'stroke-dasharray':'4,4' }));
  }

  // Border
  svg.appendChild(svgEl('rect', { x:MARGIN.left, y:MARGIN.top, width:PLOT_W, height:PLOT_H, fill:'none', stroke:'#b0b8cc', 'stroke-width':'1.5' }));

  // Axis tick labels
  var axisStyle = { fill:'#5a6280', 'font-size':'11', 'font-weight':'600' };
  [t('axisLow'), t('axisMedium'), t('axisHigh')].forEach(function(lbl, idx) {
    var px = MARGIN.left + idx * (PLOT_W/3) + PLOT_W/6;
    var tEl = svgEl('text', Object.assign({ x:px, y: MARGIN.top + PLOT_H + 17, 'text-anchor':'middle' }, axisStyle));
    tEl.textContent = lbl; svg.appendChild(tEl);
  });
  [t('axisLow'), t('axisMed'), t('axisHigh')].forEach(function(lbl, idx) {
    var py = MARGIN.top + (2 - idx) * (PLOT_H/3) + PLOT_H/6;
    var tEl = svgEl('text', Object.assign({ x: MARGIN.left - 6, y: py + 4, 'text-anchor':'end' }, axisStyle));
    tEl.textContent = lbl; svg.appendChild(tEl);
  });

  // Axis titles
  var xLabel = svgEl('text', { x: MARGIN.left + PLOT_W/2, y: SVG_H - 4, 'text-anchor':'middle', fill:'#1E2761', 'font-size':'12', 'font-weight':'700' });
  xLabel.textContent = t('xAxis'); svg.appendChild(xLabel);
  var yLabel = svgEl('text', { x: 13, y: MARGIN.top + PLOT_H/2, 'text-anchor':'middle', fill:'#1E2761', 'font-size':'12', 'font-weight':'700', transform:'rotate(-90,13,' + (MARGIN.top + PLOT_H/2) + ')' });
  yLabel.textContent = t('yAxis'); svg.appendChild(yLabel);

  var trailOn = state.showTrail;
  var allSnaps = state.snapshots;
  var currentIdx = state.currentSnapIndex;

  if (trailOn && currentIdx > 0) {
    state.stakeholders.forEach(function(sh) {
      var pts = [];
      for (var ti = 0; ti <= currentIdx; ti++) {
        var pos = computeSnapPositions(allSnaps[ti]);
        var e = getEntry(allSnaps[ti], sh.id);
        if (pos[sh.id] && e) pts.push({ x: pos[sh.id].x, y: pos[sh.id].y, att: e.attitude });
      }
      for (var ti = 0; ti < pts.length - 1; ti++) {
        svg.appendChild(svgEl('line', { x1:pts[ti].x, y1:pts[ti].y, x2:pts[ti+1].x, y2:pts[ti+1].y, stroke:'#8892b0', 'stroke-width':'1.5', 'stroke-dasharray':'5,3', opacity:'0.5' }));
      }
      for (var ti = 0; ti < pts.length - 1; ti++) {
        svg.appendChild(svgEl('circle', { cx:pts[ti].x, cy:pts[ti].y, r:'5', fill: ATT_COLOR[pts[ti].att] || '#999', opacity: String(0.18 + ti * 0.1) }));
      }
    });
  }

  var currPos = computeSnapPositions(snap);

  state.stakeholders.forEach(function(sh) {
    var e = getEntry(snap, sh.id);
    var pos = currPos[sh.id];
    if (!e || !pos) return;
    var x = pos.x, y = pos.y;
    var color = ATT_COLOR[e.attitude] || '#999';

    var g = svgEl('g', { 'data-sid': sh.id, style:'cursor:pointer' });
    g.appendChild(svgEl('circle', { cx:x, cy:y, r:'8', fill:color, stroke:'white', 'stroke-width':'2' }));
    var icon = { '推進':'▲', '中立':'●', '抵抗':'▼' }[e.attitude] || '●';
    var iconT = svgEl('text', { x:x, y: y+3.5, 'text-anchor':'middle', fill:'white', 'font-size':'7', 'pointer-events':'none' });
    iconT.textContent = icon;
    g.appendChild(iconT);

    (function(shCopy, eCopy) {
      g.addEventListener('mouseenter', function(ev) { showTooltip(ev, shCopy, eCopy); });
      g.addEventListener('mouseleave', hideTooltip);
      g.addEventListener('mousemove', moveTooltip);
    })(sh, e);
    svg.appendChild(g);
  });

  state.stakeholders.forEach(function(sh) {
    var e = getEntry(snap, sh.id);
    var pos = currPos[sh.id];
    if (!e || !pos) return;
    var x = pos.x, y = pos.y, dx = pos.dx;

    var maxLen = 10;
    var label = sh.name.length > maxLen ? sh.name.slice(0, maxLen) + '…' : sh.name;
    var onLeft = dx < -2;
    var lx = onLeft ? x - 10 : x + 10;
    var anchor = onLeft ? 'end' : 'start';

    var tEl = svgEl('text', { x: lx, y: y + 4, 'text-anchor': anchor, 'font-size':'9', fill:'#1e2761', 'pointer-events':'none', 'font-weight':'500' });
    tEl.textContent = label;
    svg.appendChild(tEl);
  });
}

// Tooltip
var tooltipEl = document.getElementById('tooltip');
function showTooltip(ev, sh, entry) {
  tooltipEl.classList.remove('hidden');
  tooltipEl.innerHTML = '<strong>' + sh.name + '</strong><br>'
    + t('tooltipDept') + ': ' + sh.dept + '<br>'
    + 'Impact: ' + '★'.repeat(entry.impact) + '☆'.repeat(3-entry.impact)
    + '&nbsp;Influence: ' + '★'.repeat(entry.influence) + '☆'.repeat(3-entry.influence) + '<br>'
    + t('tooltipAttitude') + ': ' + attDisplay(entry.attitude);
  moveTooltip(ev);
}
function moveTooltip(ev) {
  tooltipEl.style.left = (ev.clientX + 14) + 'px';
  tooltipEl.style.top = (ev.clientY - 8) + 'px';
}
function hideTooltip() { tooltipEl.classList.add('hidden'); }

// ============================================================
function attChangeIcon(prev, curr) {
  if (!prev) return '<span class="change-indicator change-neutral">—</span>';
  var order = { '推進': 2, '中立': 1, '抵抗': 0 };
  var d = order[curr] - order[prev];
  if (d > 0) return '<span class="change-indicator change-up" title="' + t('ttlImprove') + '">↑</span>';
  if (d < 0) return '<span class="change-indicator change-down" title="' + t('ttlWorsen') + '">↓</span>';
  return '<span class="change-indicator change-neutral">→</span>';
}

function renderTable() {
  var snap = currentSnap();
  var prev = prevSnap();
  var tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if (!snap) return;

  var impactOpts = [
    { v:1, l: '1 ' + t('axisLow') },
    { v:2, l: '2 ' + t('axisMed') },
    { v:3, l: '3 ' + t('axisHigh') }
  ];

  state.stakeholders.forEach(function(sh) {
    var e = getEntry(snap, sh.id);
    var pe = getEntry(prev, sh.id);
    if (!e) return;

    var tr = document.createElement('tr');
    var prevAtt = pe ? pe.attitude : null;
    var changeHtml = attChangeIcon(prevAtt, e.attitude);

    var impSel = impactOpts.map(function(o) {
      return '<option value="' + o.v + '"' + (e.impact===o.v?' selected':'') + '>' + o.l + '</option>';
    }).join('');
    var infSel = impactOpts.map(function(o) {
      return '<option value="' + o.v + '"' + (e.influence===o.v?' selected':'') + '>' + o.l + '</option>';
    }).join('');

    tr.innerHTML =
      '<td>' + changeHtml + '</td>' +
      '<td style="font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + sh.name + '">' + sh.name + '</td>' +
      '<td style="color:var(--text-light);font-size:11px">' + sh.dept + '</td>' +
      '<td><select data-sid="' + sh.id + '" data-field="impact">' + impSel + '</select></td>' +
      '<td><select data-sid="' + sh.id + '" data-field="influence">' + infSel + '</select></td>' +
      '<td><button class="attitude-btn att-' + e.attitude + '" data-sid="' + sh.id + '" data-att="' + e.attitude + '">' + attDisplay(e.attitude) + '</button></td>' +
      '<td><button class="btn btn-danger" data-del="' + sh.id + '">×</button></td>';
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll('select[data-field]').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var sid = sel.dataset.sid, field = sel.dataset.field;
      var entry = getEntry(currentSnap(), sid);
      if (entry) { entry[field] = parseInt(sel.value); saveState(); renderAll(); }
    });
  });
  tbody.querySelectorAll('.attitude-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var sid = btn.dataset.sid;
      var entry = getEntry(currentSnap(), sid);
      if (!entry) return;
      var idx = ATTITUDES.indexOf(entry.attitude);
      entry.attitude = ATTITUDES[(idx + 1) % 3];
      saveState(); renderAll();
    });
  });
  tbody.querySelectorAll('[data-del]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var sid = btn.dataset.del;
      if (!confirm(t('confirmDeleteGroup'))) return;
      state.stakeholders = state.stakeholders.filter(function(s) { return s.id !== sid; });
      state.snapshots.forEach(function(sn) { sn.entries = sn.entries.filter(function(e) { return e.stakeholderId !== sid; }); });
      saveState(); renderAll();
    });
  });
}

  document.getElementById('newName').value = '';
  document.getElementById('newDept').value = '';
  saveState(); renderAll();
});

// ============================================================
// SUMMARY
// ============================================================
function quadrant(influence, impact) {
  if (influence >= 2 && impact >= 2) return 'q1';
  if (influence >= 2 && impact < 2)  return 'q2';
  if (influence < 2  && impact >= 2) return 'q3';
  return 'q4';
}

function renderSummary() {
  var snap = currentSnap();
  var prev = prevSnap();
  var grid = document.getElementById('summaryGrid');
  if (!snap) { grid.innerHTML = ''; return; }

  var counts = { '推進': 0, '中立': 0, '抵抗': 0 };
  var qCounts = { q1: 0, q2: 0, q3: 0, q4: 0 };
  snap.entries.forEach(function(e) {
    counts[e.attitude] = (counts[e.attitude] || 0) + 1;
    var q = quadrant(e.influence, e.impact);
    qCounts[q]++;
  });
  var total = snap.entries.length;

  var prevCounts = { '推進': 0, '中立': 0, '抵抗': 0 };
  if (prev) prev.entries.forEach(function(e) { prevCounts[e.attitude] = (prevCounts[e.attitude] || 0) + 1; });

  var diffItems = [];
  if (prev) {
    ATTITUDES.forEach(function(a) {
      var d = counts[a] - prevCounts[a];
      if (d !== 0) diffItems.push({ att: a, d: d });
    });
  }

  var attBars = ATTITUDES.map(function(a) {
    return '<div class="att-bar-row">' +
      '<span>' + attDisplay(a) + '</span>' +
      '<div class="att-bar-bg"><div class="att-bar-fill" style="width:' + (total ? counts[a]/total*100 : 0) + '%;background:' + ATT_COLOR[a] + '"></div></div>' +
      '<span class="att-bar-count">' + counts[a] + '</span>' +
      '</div>';
  }).join('');

  var qRows = ['q1','q2','q3','q4'].map(function(q) {
    return '<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--text-light)">' + t(q) + '</span><strong>' + qCounts[q] + '</strong></div>';
  }).join('');

  var diffHtml;
  if (!prev) {
    diffHtml = '<div class="diff-text">' + t('firstSnap') + '</div>';
  } else if (diffItems.length === 0) {
    diffHtml = '<div class="diff-text">' + t('noChange') + '</div>';
  } else {
    diffHtml = diffItems.map(function(item) {
      return '<div class="diff-item"><span class="' + (item.d > 0 ? 'diff-pos' : 'diff-neg') + '">' + (item.d > 0 ? '+' : '') + item.d + ' ' + attDisplay(item.att) + '</span></div>';
    }).join('');
  }

  grid.innerHTML =
    '<div class="summary-card"><h3>' + t('cardAttitude') + '</h3><div class="attitude-bars">' + attBars + '</div></div>' +
    '<div class="summary-card"><h3>' + t('cardQuadrant') + '</h3>' + qRows + '</div>' +
    '<div class="summary-card"><h3>' + t('cardDiff') + '</h3>' + diffHtml + '</div>';
}

// ============================================================
// SNAPSHOT MANAGEMENT
// ============================================================
document.getElementById('newSnapshotBtn').addEventListener('click', function() {
  var today = new Date().toISOString().slice(0, 10);
  document.getElementById('modalDate').value = today;
  document.getElementById('modalLabel').value = '';
  document.getElementById('modalOverlay').classList.remove('hidden');
});

document.getElementById('modalCancel').addEventListener('click', function() {
  document.getElementById('modalOverlay').classList.add('hidden');
});

document.getElementById('modalCreate').addEventListener('click', function() {
  var date = document.getElementById('modalDate').value;
  var label = document.getElementById('modalLabel').value.trim();
  if (!date || !label) { alert(t('alertDateLabel')); return; }

  var snap = currentSnap();
  var newEntries = snap
    ? JSON.parse(JSON.stringify(snap.entries))
    : state.stakeholders.map(function(sh) { return { stakeholderId: sh.id, impact: 2, influence: 2, attitude: '中立' }; });

  var newSnap = { id: 'snap' + Date.now(), date: date, label: label, entries: newEntries };
  state.snapshots.push(newSnap);
  state.snapshots.sort(function(a, b) { return a.date.localeCompare(b.date); });
  state.currentSnapIndex = state.snapshots.findIndex(function(s) { return s.id === newSnap.id; });

  document.getElementById('modalOverlay').classList.add('hidden');
  saveState(); renderAll();
});

document.getElementById('deleteSnapshotBtn').addEventListener('click', function() {
  if (state.snapshots.length <= 1) { alert(t('alertOnlyOne')); return; }
  var snap = currentSnap();
  if (!confirm(t('confirmDeleteSnap1') + snap.label + t('confirmDeleteSnap2'))) return;
  state.snapshots.splice(state.currentSnapIndex, 1);
  state.currentSnapIndex = Math.min(state.currentSnapIndex, state.snapshots.length - 1);
  saveState(); renderAll();
});

document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.add('hidden');
});

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  applyLang();
  renderControls();
  renderMap();
  renderTable();
  renderSummary();
}

// ============================================================
// INIT
// ============================================================
window.onerror = function(msg, src, line) {
  var el = document.getElementById('js-error');
  if (el) { el.style.display = 'block'; el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')'; }
};

try {
  loadState();
  renderAll();
} catch(e) {
  var el = document.getElementById('js-error');
  if (el) { el.style.display = 'block'; el.textContent = 'Init Error: ' + e.message; }
}
</script>
