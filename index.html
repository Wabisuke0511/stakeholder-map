<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ステークホルダーマップ</title>
<style>
:root {
  --navy: #1E2761;
  --orange: #E8A33D;
  --bg: #f8f9fc;
  --white: #ffffff;
  --border: #dde1ea;
  --text: #2c3148;
  --text-light: #6b7280;
  --promote: #2E7D5B;
  --neutral: #9AA3B2;
  --resist: #B0413E;
  --q1-bg: rgba(46,125,91,0.07);
  --q2-bg: rgba(232,163,61,0.07);
  --q3-bg: rgba(30,39,97,0.05);
  --q4-bg: rgba(176,65,62,0.05);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

/* Header */
.header { background: var(--navy); color: white; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.05em; flex-shrink: 0; }
.privacy-note { font-size: 10px; color: rgba(255,255,255,0.55); margin-left: auto; flex-shrink: 0; }

/* Control bar */
.controls { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.control-group { display: flex; align-items: center; gap: 8px; }
.control-group label { font-size: 12px; color: var(--text-light); white-space: nowrap; }
select { border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 13px; color: var(--text); background: var(--white); cursor: pointer; }
input[type=range] { width: 140px; accent-color: var(--navy); cursor: pointer; }
.snapshot-label { font-size: 12px; color: var(--navy); font-weight: 600; min-width: 80px; }
.trail-check { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 13px; }
.trail-check input { accent-color: var(--navy); width: 15px; height: 15px; cursor: pointer; }
.btn { background: var(--orange); color: white; border: none; border-radius: 4px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.15s; }
.btn:hover { opacity: 0.85; }
.btn-sm { background: var(--navy); font-size: 11px; padding: 4px 10px; }
.btn-danger { background: #c0392b; font-size: 11px; padding: 4px 10px; }

/* Main layout */
.main { display: flex; gap: 0; flex-wrap: wrap; }
.map-section { flex: 1 1 460px; max-width: 640px; padding: 16px; min-width: 0; }
.side-section { width: 360px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--white); display: flex; flex-direction: column; height: 600px; }
@media (max-width: 900px) {
  .side-section { width: 100%; border-left: none; border-top: 1px solid var(--border); height: auto; }
}

/* SVG map */
.map-container { position: relative; background: var(--white); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.map-container svg { display: block; width: 100%; height: auto; max-width: 608px; }

/* Side panel */
.side-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
.side-header h2 { font-size: 13px; font-weight: 700; color: var(--navy); }
.table-scroll { overflow-x: auto; overflow-y: auto; flex: 1; min-height: 0; }
@media (max-width: 900px) { .table-scroll { max-height: 44vh; flex: none; } }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { background: #f3f4f8; padding: 8px 10px; text-align: left; font-weight: 600; color: var(--text-light); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid #eef0f5; vertical-align: middle; }
tr:hover td { background: #f8f9fc; }
td select { font-size: 11px; padding: 2px 4px; border-radius: 3px; }
.attitude-btn { border: none; border-radius: 3px; padding: 3px 8px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.1s; }
.attitude-btn:hover { opacity: 0.8; }
.att-推進 { background: rgba(46,125,91,0.15); color: var(--promote); }
.att-中立 { background: rgba(154,163,178,0.2); color: #555; }
.att-抵抗 { background: rgba(176,65,62,0.15); color: var(--resist); }
.change-indicator { font-size: 13px; font-weight: 700; margin-right: 2px; }
.change-up { color: var(--promote); }
.change-down { color: var(--resist); }
.change-neutral { color: var(--neutral); }
.add-row { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
.add-row input { flex: 1; min-width: 100px; border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 12px; }

/* ========== Mobile overrides (≤ 600px) ========== */
@media (max-width: 600px) {
  /* Header */
  .header { padding: 10px 14px; gap: 8px; }
  .header h1 { font-size: 14px; }
  .header > span:nth-child(2) { display: none; }
  .privacy-note { font-size: 9px; }

  /* Controls: stack into 2 rows */
  .controls { padding: 8px 12px; gap: 8px; }
  .control-group { width: 100%; }
  .control-group label { font-size: 11px; min-width: 72px; }
  #snapshotSelect { flex: 1; font-size: 12px; }
  input[type=range] { flex: 1; width: auto; }
  .snapshot-label { font-size: 11px; min-width: 56px; }
  .trail-check { font-size: 12px; }
  .btn { font-size: 12px; padding: 6px 12px; }
  .btn-sm { font-size: 10px; padding: 4px 8px; }

  /* Map section */
  .map-section { padding: 10px 10px 6px; }

  /* Side panel */
  .side-header { padding: 10px 12px; }
  .side-header h2 { font-size: 12px; }
  .table-scroll { max-height: 42vh; }

  /* Table: touch-friendly sizes */
  th { padding: 8px 8px; font-size: 11px; }
  td { padding: 8px 8px; }
  td select { font-size: 13px; padding: 4px 5px; min-height: 32px; }
  .attitude-btn { padding: 6px 10px; font-size: 12px; min-height: 32px; }
  .btn-danger { padding: 5px 8px; font-size: 11px; }

  /* Add row */
  .add-row { padding: 8px 12px; gap: 6px; }
  .add-row input { font-size: 13px; padding: 7px 8px; }

  /* Summary */
  .summary { padding: 12px 14px; }
  .summary-grid { grid-template-columns: 1fr; }
}

/* Summary */
.summary { border-top: 1px solid var(--border); background: var(--white); padding: 16px 20px; }
.summary h2 { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 12px; }
.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.summary-card { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; }
.summary-card h3 { font-size: 11px; font-weight: 600; color: var(--text-light); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
.summary-card .stat { font-size: 22px; font-weight: 700; color: var(--navy); }
.attitude-bars { display: flex; flex-direction: column; gap: 4px; }
.att-bar-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
.att-bar-row span:first-child { width: 30px; color: var(--text-light); }
.att-bar-bg { flex: 1; height: 8px; background: #eef0f5; border-radius: 4px; overflow: hidden; }
.att-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.att-bar-count { width: 20px; text-align: right; font-weight: 600; }
.diff-text { font-size: 12px; color: var(--text-light); }
.diff-item { margin-top: 4px; }
.diff-pos { color: var(--promote); font-weight: 600; }
.diff-neg { color: var(--resist); font-weight: 600; }

/* Modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-overlay.hidden { display: none; }
.modal { background: white; border-radius: 8px; padding: 24px; width: 380px; max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal h2 { font-size: 15px; font-weight: 700; color: var(--navy); margin-bottom: 16px; }
.modal-field { margin-bottom: 12px; }
.modal-field label { display: block; font-size: 12px; color: var(--text-light); margin-bottom: 4px; }
.modal-field input { width: 100%; border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; font-size: 13px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.btn-cancel { background: #eef0f5; color: var(--text); border: none; border-radius: 4px; padding: 7px 16px; font-size: 13px; cursor: pointer; }
.tooltip { position: fixed; background: rgba(30,39,97,0.92); color: white; border-radius: 5px; padding: 6px 10px; font-size: 12px; pointer-events: none; z-index: 50; white-space: nowrap; transition: opacity 0.1s; }
</style>
</head>
<body>

<div id="js-error" style="display:none;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-family:monospace;white-space:pre-wrap;"></div>
<div class="header">
  <h1>ステークホルダーマップ</h1>
  <span style="font-size:12px;color:rgba(255,255,255,0.7)">組織変革 推進状況の可視化</span>
  <span class="privacy-note">🔒 すべてのデータはこのブラウザ内にのみ保存されます。外部通信なし。</span>
</div>

<div class="controls">
  <div class="control-group">
    <label>スナップショット</label>
    <select id="snapshotSelect"></select>
  </div>
  <div class="control-group">
    <label>タイムライン</label>
    <input type="range" id="timelineSlider" min="0" max="0" value="0" step="1">
    <span class="snapshot-label" id="sliderLabel"></span>
  </div>
  <label class="trail-check">
    <input type="checkbox" id="trailCheck"> 軌跡を表示
  </label>
  <button class="btn" id="newSnapshotBtn">＋ 新しいスナップショット</button>
</div>

<div class="main">
  <div class="map-section">
    <div class="map-container" id="mapContainer">
      <svg id="mapSvg" viewBox="0 0 560 460" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>
  <div class="side-section">
    <div class="side-header">
      <h2 id="sideTitle">ステークホルダー一覧</h2>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" id="deleteSnapshotBtn">このスナップショットを削除</button>
      </div>
    </div>
    <div class="table-scroll">
      <table id="stakeholderTable">
        <thead>
          <tr>
            <th>変化</th>
            <th>群名</th>
            <th>部門</th>
            <th>Impact</th>
            <th>Influence</th>
            <th>態度</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
    <div class="add-row">
      <input id="newName" placeholder="群名 ※個人名は入力しないでください" style="flex:2">
      <input id="newDept" placeholder="部門" style="flex:1">
      <button class="btn btn-sm" id="addStakeholderBtn">追加</button>
    </div>
  </div>
</div>

<div class="summary" id="summarySection">
  <h2>サマリー</h2>
  <div class="summary-grid" id="summaryGrid"></div>
</div>

<!-- New snapshot modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <h2>新しいスナップショットを作成</h2>
    <div class="modal-field">
      <label>日付</label>
      <input type="date" id="modalDate">
    </div>
    <div class="modal-field">
      <label>ラベル（例：設計フェーズ完了）</label>
      <input type="text" id="modalLabel" placeholder="ラベルを入力">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="modalCancel">キャンセル</button>
      <button class="btn" id="modalCreate">作成</button>
    </div>
  </div>
</div>

<!-- Tooltip -->
<div class="tooltip hidden" id="tooltip"></div>

<script>
// ============================================================
// DATA
// ============================================================
const ATTITUDES = ['推進', '中立', '抵抗'];
const ATT_COLOR = { '推進': '#2E7D5B', '中立': '#9AA3B2', '抵抗': '#B0413E' };

const INITIAL_STAKEHOLDERS = [
  { id:'s1', name:'Finance VP（スポンサー）', dept:'Finance', note:'' },
  { id:'s2', name:'Supply Chain VP', dept:'SCM', note:'' },
  { id:'s3', name:'IT / システム運用チーム', dept:'IT', note:'' },
  { id:'s4', name:'People Manager層', dept:'Finance/SCM', note:'' },
  { id:'s5', name:'決算・経理チーム', dept:'Finance', note:'' },
  { id:'s6', name:'調達・購買担当', dept:'SCM', note:'' },
  { id:'s7', name:'現行レポートの実務保有者', dept:'Finance/SCM', note:'' },
  { id:'s8', name:'AP / AR 処理担当', dept:'Finance', note:'' },
  { id:'s9', name:'地域拠点のローカル財務', dept:'Finance', note:'' },
  { id:'s10', name:'倉庫・物流オペレーション', dept:'SCM', note:'' },
  { id:'s11', name:'社内監査・品質保証', dept:'Quality', note:'' },
  { id:'s12', name:'営業サポート', dept:'Commercial', note:'' },
];

const INITIAL_SNAPSHOTS = [
  {
    id:'snap1', date:'2025-04-01', label:'キックオフ時',
    entries: [
      { stakeholderId:'s1', impact:2, influence:3, attitude:'推進' },
      { stakeholderId:'s2', impact:3, influence:3, attitude:'推進' },
      { stakeholderId:'s3', impact:3, influence:3, attitude:'中立' },
      { stakeholderId:'s4', impact:2, influence:3, attitude:'中立' },
      { stakeholderId:'s5', impact:3, influence:2, attitude:'中立' },
      { stakeholderId:'s6', impact:3, influence:2, attitude:'中立' },
      { stakeholderId:'s7', impact:3, influence:2, attitude:'中立' },
      { stakeholderId:'s8', impact:3, influence:1, attitude:'中立' },
      { stakeholderId:'s9', impact:3, influence:1, attitude:'中立' },
      { stakeholderId:'s10', impact:2, influence:1, attitude:'中立' },
      { stakeholderId:'s11', impact:1, influence:2, attitude:'中立' },
      { stakeholderId:'s12', impact:1, influence:2, attitude:'中立' },
    ]
  },
  {
    id:'snap2', date:'2025-09-01', label:'設計フェーズ完了',
    entries: [
      { stakeholderId:'s1', impact:2, influence:3, attitude:'推進' },
      { stakeholderId:'s2', impact:3, influence:3, attitude:'推進' },
      { stakeholderId:'s3', impact:3, influence:3, attitude:'推進' },
      { stakeholderId:'s4', impact:2, influence:3, attitude:'推進' },
      { stakeholderId:'s5', impact:3, influence:2, attitude:'中立' },
      { stakeholderId:'s6', impact:3, influence:2, attitude:'抵抗' },
      { stakeholderId:'s7', impact:3, influence:2, attitude:'抵抗' },
      { stakeholderId:'s8', impact:3, influence:1, attitude:'中立' },
      { stakeholderId:'s9', impact:3, influence:1, attitude:'抵抗' },
      { stakeholderId:'s10', impact:2, influence:1, attitude:'中立' },
      { stakeholderId:'s11', impact:1, influence:2, attitude:'中立' },
      { stakeholderId:'s12', impact:1, influence:2, attitude:'中立' },
    ]
  },
  {
    id:'snap3', date:'2026-01-15', label:'go-live 2ヶ月前',
    entries: [
      { stakeholderId:'s1', impact:2, influence:3, attitude:'推進' },
      { stakeholderId:'s2', impact:3, influence:3, attitude:'推進' },
      { stakeholderId:'s3', impact:3, influence:3, attitude:'推進' },
      { stakeholderId:'s4', impact:2, influence:3, attitude:'推進' },
      { stakeholderId:'s5', impact:3, influence:2, attitude:'推進' },
      { stakeholderId:'s6', impact:3, influence:2, attitude:'中立' },
      { stakeholderId:'s7', impact:3, influence:2, attitude:'抵抗' },
      { stakeholderId:'s8', impact:3, influence:1, attitude:'抵抗' },
      { stakeholderId:'s9', impact:3, influence:1, attitude:'抵抗' },
      { stakeholderId:'s10', impact:2, influence:1, attitude:'中立' },
      { stakeholderId:'s11', impact:1, influence:2, attitude:'中立' },
      { stakeholderId:'s12', impact:1, influence:2, attitude:'中立' },
    ]
  },
];

// ============================================================
// STATE
// ============================================================
let state = { stakeholders: [], snapshots: [], currentSnapIndex: 0, showTrail: false };

var STORAGE_KEY = 'stakeholder-map-v1';

function storageGet() {
  try { var v = localStorage.getItem(STORAGE_KEY); if (v) return v; } catch(e) {}
  try { return sessionStorage.getItem(STORAGE_KEY); } catch(e) {}
  return null;
}
function storageSet(val) {
  try { localStorage.setItem(STORAGE_KEY, val); return; } catch(e) {}
  try { sessionStorage.setItem(STORAGE_KEY, val); } catch(e) {}
}

function loadState() {
  try {
    var raw = storageGet();
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.stakeholders && parsed.stakeholders.length > 0
          && parsed.snapshots && parsed.snapshots.length > 0) {
        state = parsed;
        return;
      }
    }
  } catch(e) {}
  state = {
    stakeholders: JSON.parse(JSON.stringify(INITIAL_STAKEHOLDERS)),
    snapshots: JSON.parse(JSON.stringify(INITIAL_SNAPSHOTS)),
    currentSnapIndex: 0,
    showTrail: false
  };
  saveState();
}

function saveState() {
  try { storageSet(JSON.stringify(state)); } catch(e) {}
}

function currentSnap() { return state.snapshots[state.currentSnapIndex]; }
function prevSnap() { return state.currentSnapIndex > 0 ? state.snapshots[state.currentSnapIndex - 1] : null; }

function getEntry(snap, sid) { return snap ? snap.entries.find(e => e.stakeholderId === sid) : null; }

// ============================================================
// SVG MAP — cell sub-grid positioning
// ============================================================
const SVG_W = 560, SVG_H = 460;
const MARGIN = { top: 28, right: 18, bottom: 46, left: 52 };
const PLOT_W = SVG_W - MARGIN.left - MARGIN.right;
const PLOT_H = SVG_H - MARGIN.top - MARGIN.bottom;

// Returns {dx, dy} offsets from cell center for N dots arranged without overlap
function getSubOffsets(n) {
  const S = 26;
  if (n <= 1) return [{dx:0, dy:0}];
  if (n === 2) return [{dx:-S*0.5, dy:0}, {dx:S*0.5, dy:0}];
  if (n === 3) return [
    {dx:0, dy:-S*0.6},
    {dx:-S*0.56, dy:S*0.4},
    {dx: S*0.56, dy:S*0.4}
  ];
  if (n === 4) return [
    {dx:-S*0.5, dy:-S*0.5}, {dx:S*0.5, dy:-S*0.5},
    {dx:-S*0.5, dy: S*0.5}, {dx:S*0.5, dy: S*0.5}
  ];
  // 5+: evenly spaced on a circle
  return Array.from({length:n}, (_, i) => {
    const a = (i/n)*2*Math.PI - Math.PI/2;
    return {dx: Math.cos(a)*S*0.8, dy: Math.sin(a)*S*0.8};
  });
}

// Compute pixel positions for every stakeholder in a given snapshot
function computeSnapPositions(snap) {
  if (!snap) return {};
  const cellW = PLOT_W / 3;
  const cellH = PLOT_H / 3;

  // Group entries by cell, sorted by id for determinism
  const cellGroups = {};
  snap.entries.forEach(e => {
    const key = `${e.influence}_${e.impact}`;
    if (!cellGroups[key]) cellGroups[key] = [];
    cellGroups[key].push(e);
  });
  Object.values(cellGroups).forEach(g => g.sort((a, b) => a.stakeholderId.localeCompare(b.stakeholderId)));

  const positions = {};
  Object.entries(cellGroups).forEach(([key, group]) => {
    const [inf, imp] = key.split('_').map(Number);
    const cx = MARGIN.left + (inf - 1) * cellW + cellW / 2;
    const cy = MARGIN.top  + (3 - imp) * cellH + cellH / 2;
    const offsets = getSubOffsets(group.length);
    group.forEach((e, i) => {
      positions[e.stakeholderId] = {
        x: cx + offsets[i].dx,
        y: cy + offsets[i].dy,
        dx: offsets[i].dx   // used for label side decision
      };
    });
  });
  return positions;
}

function svgEl(tag, attrs) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

function renderMap() {
  const svg = document.getElementById('mapSvg');
  svg.innerHTML = '';

  const snap = currentSnap();
  if (!snap) return;

  // Quadrant backgrounds
  const quads = [
    { x: MARGIN.left + PLOT_W/2, y: MARGIN.top,           w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q1-bg)', label:'巻き込む' },
    { x: MARGIN.left + PLOT_W/2, y: MARGIN.top + PLOT_H/2, w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q2-bg)', label:'味方につける' },
    { x: MARGIN.left,            y: MARGIN.top,           w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q3-bg)', label:'支える' },
    { x: MARGIN.left,            y: MARGIN.top + PLOT_H/2, w: PLOT_W/2, h: PLOT_H/2, fill:'var(--q4-bg)', label:'知らせる' },
  ];
  quads.forEach(q => {
    svg.appendChild(svgEl('rect', { x:q.x, y:q.y, width:q.w, height:q.h, fill:q.fill }));
    const t = svgEl('text', { x: q.x + q.w/2, y: q.y + 18, 'text-anchor':'middle', fill:'#aab0c4', 'font-size':'12', 'font-weight':'600', 'pointer-events':'none' });
    t.textContent = q.label;
    svg.appendChild(t);
  });

  // Grid lines
  for (let i = 1; i <= 2; i++) {
    const x = MARGIN.left + (PLOT_W / 3) * i;
    svg.appendChild(svgEl('line', { x1:x, y1:MARGIN.top, x2:x, y2:MARGIN.top+PLOT_H, stroke:'#d0d4e0', 'stroke-width':'1', 'stroke-dasharray':'4,4' }));
    const y = MARGIN.top + (PLOT_H / 3) * i;
    svg.appendChild(svgEl('line', { x1:MARGIN.left, y1:y, x2:MARGIN.left+PLOT_W, y2:y, stroke:'#d0d4e0', 'stroke-width':'1', 'stroke-dasharray':'4,4' }));
  }

  // Border
  svg.appendChild(svgEl('rect', { x:MARGIN.left, y:MARGIN.top, width:PLOT_W, height:PLOT_H, fill:'none', stroke:'#b0b8cc', 'stroke-width':'1.5' }));

  // Axis tick labels
  const axisStyle = { fill:'#5a6280', 'font-size':'11', 'font-weight':'600' };
  ['Low','Medium','High'].forEach((lbl, i) => {
    const x = MARGIN.left + i * (PLOT_W/3) + PLOT_W/6;
    const t = svgEl('text', { x, y: MARGIN.top + PLOT_H + 17, 'text-anchor':'middle', ...axisStyle });
    t.textContent = lbl; svg.appendChild(t);
  });
  ['Low','Med','High'].forEach((lbl, i) => {
    const y = MARGIN.top + (2 - i) * (PLOT_H/3) + PLOT_H/6;
    const t = svgEl('text', { x: MARGIN.left - 6, y: y + 4, 'text-anchor':'end', ...axisStyle });
    t.textContent = lbl; svg.appendChild(t);
  });

  // Axis titles
  const xLabel = svgEl('text', { x: MARGIN.left + PLOT_W/2, y: SVG_H - 4, 'text-anchor':'middle', fill:'#1E2761', 'font-size':'12', 'font-weight':'700' });
  xLabel.textContent = 'Influence（影響力）→'; svg.appendChild(xLabel);
  const yLabel = svgEl('text', { x: 13, y: MARGIN.top + PLOT_H/2, 'text-anchor':'middle', fill:'#1E2761', 'font-size':'12', 'font-weight':'700', transform:`rotate(-90,13,${MARGIN.top + PLOT_H/2})` });
  yLabel.textContent = '← Impact（影響度）'; svg.appendChild(yLabel);

  const trailOn = state.showTrail;
  const allSnaps = state.snapshots;
  const currentIdx = state.currentSnapIndex;

  // Trail: lines + ghost dots using sub-grid positions per snapshot
  if (trailOn && currentIdx > 0) {
    state.stakeholders.forEach(sh => {
      const pts = [];
      for (let i = 0; i <= currentIdx; i++) {
        const pos = computeSnapPositions(allSnaps[i]);
        const e = getEntry(allSnaps[i], sh.id);
        if (pos[sh.id] && e) pts.push({ ...pos[sh.id], att: e.attitude });
      }
      for (let i = 0; i < pts.length - 1; i++) {
        svg.appendChild(svgEl('line', { x1:pts[i].x, y1:pts[i].y, x2:pts[i+1].x, y2:pts[i+1].y, stroke:'#8892b0', 'stroke-width':'1.5', 'stroke-dasharray':'5,3', opacity:'0.5' }));
      }
      for (let i = 0; i < pts.length - 1; i++) {
        svg.appendChild(svgEl('circle', { cx:pts[i].x, cy:pts[i].y, r:'5', fill: ATT_COLOR[pts[i].att] || '#999', opacity: String(0.18 + i * 0.1) }));
      }
    });
  }

  // Current snapshot positions
  const currPos = computeSnapPositions(snap);

  // Draw dots
  state.stakeholders.forEach(sh => {
    const e = getEntry(snap, sh.id);
    const pos = currPos[sh.id];
    if (!e || !pos) return;
    const { x, y } = pos;
    const color = ATT_COLOR[e.attitude] || '#999';

    const g = svgEl('g', { 'data-sid': sh.id, style:'cursor:pointer' });
    g.appendChild(svgEl('circle', { cx:x, cy:y, r:'8', fill:color, stroke:'white', 'stroke-width':'2' }));
    const icon = { '推進':'▲', '中立':'●', '抵抗':'▼' }[e.attitude] || '●';
    const iconT = svgEl('text', { x, y: y+3.5, 'text-anchor':'middle', fill:'white', 'font-size':'7', 'pointer-events':'none' });
    iconT.textContent = icon;
    g.appendChild(iconT);

    g.addEventListener('mouseenter', ev => showTooltip(ev, sh, e));
    g.addEventListener('mouseleave', hideTooltip);
    g.addEventListener('mousemove', ev => moveTooltip(ev));
    svg.appendChild(g);
  });

  // Draw labels — left side of dot if dx<0, right side if dx>=0
  state.stakeholders.forEach(sh => {
    const e = getEntry(snap, sh.id);
    const pos = currPos[sh.id];
    if (!e || !pos) return;
    const { x, y, dx } = pos;

    const maxLen = 10;
    const label = sh.name.length > maxLen ? sh.name.slice(0, maxLen) + '…' : sh.name;
    const onLeft = dx < -2;
    const lx = onLeft ? x - 10 : x + 10;
    const anchor = onLeft ? 'end' : 'start';

    const t = svgEl('text', { x: lx, y: y + 4, 'text-anchor': anchor, 'font-size':'9', fill:'#1e2761', 'pointer-events':'none', 'font-weight':'500' });
    t.textContent = label;
    svg.appendChild(t);
  });
}

// Tooltip
const tooltipEl = document.getElementById('tooltip');
function showTooltip(ev, sh, entry) {
  tooltipEl.classList.remove('hidden');
  tooltipEl.innerHTML = `<strong>${sh.name}</strong><br>部門: ${sh.dept}<br>Impact: ${'★'.repeat(entry.impact)}${'☆'.repeat(3-entry.impact)}&nbsp;Influence: ${'★'.repeat(entry.influence)}${'☆'.repeat(3-entry.influence)}<br>態度: ${entry.attitude}`;
  moveTooltip(ev);
}
function moveTooltip(ev) {
  tooltipEl.style.left = (ev.clientX + 14) + 'px';
  tooltipEl.style.top = (ev.clientY - 8) + 'px';
}
function hideTooltip() { tooltipEl.classList.add('hidden'); }

// ============================================================
// CONTROLS
// ============================================================
function renderControls() {
  const sel = document.getElementById('snapshotSelect');
  const slider = document.getElementById('timelineSlider');
  const n = state.snapshots.length;

  sel.innerHTML = state.snapshots.map((s, i) =>
    `<option value="${i}" ${i===state.currentSnapIndex?'selected':''}>${s.date} ${s.label}</option>`
  ).join('');

  slider.max = Math.max(0, n - 1);
  slider.value = state.currentSnapIndex;

  const snap = currentSnap();
  document.getElementById('sliderLabel').textContent = snap ? snap.label : '';
  document.getElementById('trailCheck').checked = state.showTrail;

  const sideTitle = document.getElementById('sideTitle');
  if (snap) sideTitle.textContent = `${snap.date} ${snap.label}`;
}

document.getElementById('snapshotSelect').addEventListener('change', e => {
  state.currentSnapIndex = parseInt(e.target.value);
  saveState();
  renderAll();
});

document.getElementById('timelineSlider').addEventListener('input', e => {
  state.currentSnapIndex = parseInt(e.target.value);
  document.getElementById('snapshotSelect').value = state.currentSnapIndex;
  var _s = currentSnap(); document.getElementById('sliderLabel').textContent = _s ? _s.label : '';
  saveState();
  renderAll();
});

document.getElementById('trailCheck').addEventListener('change', e => {
  state.showTrail = e.target.checked;
  saveState();
  renderMap();
});

// ============================================================
// TABLE
// ============================================================
function attChangeIcon(prev, curr) {
  if (!prev) return '<span class="change-indicator change-neutral">—</span>';
  const order = { '推進': 2, '中立': 1, '抵抗': 0 };
  const d = order[curr] - order[prev];
  if (d > 0) return '<span class="change-indicator change-up" title="改善">↑</span>';
  if (d < 0) return '<span class="change-indicator change-down" title="悪化">↓</span>';
  return '<span class="change-indicator change-neutral">→</span>';
}

function renderTable() {
  const snap = currentSnap();
  const prev = prevSnap();
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';

  if (!snap) return;

  state.stakeholders.forEach(sh => {
    const e = getEntry(snap, sh.id);
    const pe = getEntry(prev, sh.id);
    if (!e) return;

    const tr = document.createElement('tr');
    const prevAtt = pe ? pe.attitude : null;
    const changeHtml = attChangeIcon(prevAtt, e.attitude);

    tr.innerHTML = `
      <td>${changeHtml}</td>
      <td style="font-weight:500;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${sh.name}">${sh.name}</td>
      <td style="color:var(--text-light);font-size:11px">${sh.dept}</td>
      <td>
        <select data-sid="${sh.id}" data-field="impact">
          <option value="1" ${e.impact===1?'selected':''}>1 Low</option>
          <option value="2" ${e.impact===2?'selected':''}>2 Med</option>
          <option value="3" ${e.impact===3?'selected':''}>3 High</option>
        </select>
      </td>
      <td>
        <select data-sid="${sh.id}" data-field="influence">
          <option value="1" ${e.influence===1?'selected':''}>1 Low</option>
          <option value="2" ${e.influence===2?'selected':''}>2 Med</option>
          <option value="3" ${e.influence===3?'selected':''}>3 High</option>
        </select>
      </td>
      <td>
        <button class="attitude-btn att-${e.attitude}" data-sid="${sh.id}" data-att="${e.attitude}">${e.attitude}</button>
      </td>
      <td><button class="btn btn-danger" data-del="${sh.id}">×</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Events
  tbody.querySelectorAll('select[data-field]').forEach(sel => {
    sel.addEventListener('change', e => {
      const sid = sel.dataset.sid, field = sel.dataset.field;
      const entry = getEntry(currentSnap(), sid);
      if (entry) { entry[field] = parseInt(sel.value); saveState(); renderAll(); }
    });
  });
  tbody.querySelectorAll('.attitude-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.sid;
      const entry = getEntry(currentSnap(), sid);
      if (!entry) return;
      const idx = ATTITUDES.indexOf(entry.attitude);
      entry.attitude = ATTITUDES[(idx + 1) % 3];
      saveState(); renderAll();
    });
  });
  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sid = btn.dataset.del;
      if (!confirm('この群を削除しますか？全スナップショットから削除されます。')) return;
      state.stakeholders = state.stakeholders.filter(s => s.id !== sid);
      state.snapshots.forEach(sn => { sn.entries = sn.entries.filter(e => e.stakeholderId !== sid); });
      saveState(); renderAll();
    });
  });
}

// Add stakeholder
document.getElementById('addStakeholderBtn').addEventListener('click', () => {
  const name = document.getElementById('newName').value.trim();
  const dept = document.getElementById('newDept').value.trim();
  if (!name) { alert('群名を入力してください'); return; }
  if (/^[ぁ-ん一-龥ァ-ン]{1,5}$/.test(name) && !dept) {
    // likely a personal name — just a soft warn via placeholder, not a hard block
  }
  const id = 's' + Date.now();
  state.stakeholders.push({ id, name, dept: dept || '未設定', note: '' });
  state.snapshots.forEach(sn => {
    sn.entries.push({ stakeholderId: id, impact: 2, influence: 2, attitude: '中立' });
  });
  document.getElementById('newName').value = '';
  document.getElementById('newDept').value = '';
  saveState(); renderAll();
});

// ============================================================
// SUMMARY
// ============================================================
function renderSummary() {
  const snap = currentSnap();
  const prev = prevSnap();
  const grid = document.getElementById('summaryGrid');
  if (!snap) { grid.innerHTML = ''; return; }

  const counts = { '推進': 0, '中立': 0, '抵抗': 0 };
  const qCounts = { '巻き込む': 0, '味方につける': 0, '支える': 0, '知らせる': 0 };
  snap.entries.forEach(e => {
    counts[e.attitude] = (counts[e.attitude] || 0) + 1;
    const q = quadrant(e.influence, e.impact);
    qCounts[q]++;
  });
  const total = snap.entries.length;

  const prevCounts = { '推進': 0, '中立': 0, '抵抗': 0 };
  if (prev) prev.entries.forEach(e => { prevCounts[e.attitude] = (prevCounts[e.attitude] || 0) + 1; });

  const diffItems = [];
  if (prev) {
    ATTITUDES.forEach(a => {
      const d = counts[a] - prevCounts[a];
      if (d !== 0) diffItems.push({ att: a, d });
    });
  }

  grid.innerHTML = `
    <div class="summary-card">
      <h3>態度の内訳</h3>
      <div class="attitude-bars">
        ${ATTITUDES.map(a => `
          <div class="att-bar-row">
            <span>${a}</span>
            <div class="att-bar-bg"><div class="att-bar-fill" style="width:${total?counts[a]/total*100:0}%;background:${ATT_COLOR[a]}"></div></div>
            <span class="att-bar-count">${counts[a]}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div class="summary-card">
      <h3>象限ごとの群数</h3>
      ${Object.entries(qCounts).map(([q,c]) => `<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span style="color:var(--text-light)">${q}</span><strong>${c}</strong></div>`).join('')}
    </div>
    <div class="summary-card">
      <h3>前回との差分</h3>
      ${!prev ? '<div class="diff-text">最初のスナップショットです</div>' :
        diffItems.length === 0 ? '<div class="diff-text">変化なし</div>' :
        diffItems.map(({att, d}) => `<div class="diff-item"><span class="${d>0?'diff-pos':'diff-neg'}">${d>0?'＋':''}${d} ${att}</span></div>`).join('')
      }
    </div>
  `;
}

function quadrant(influence, impact) {
  if (influence >= 2 && impact >= 2) return '巻き込む';
  if (influence >= 2 && impact < 2) return '味方につける';
  if (influence < 2 && impact >= 2) return '支える';
  return '知らせる';
}

// ============================================================
// SNAPSHOT MANAGEMENT
// ============================================================
document.getElementById('newSnapshotBtn').addEventListener('click', () => {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('modalDate').value = today;
  document.getElementById('modalLabel').value = '';
  document.getElementById('modalOverlay').classList.remove('hidden');
});

document.getElementById('modalCancel').addEventListener('click', () => {
  document.getElementById('modalOverlay').classList.add('hidden');
});

document.getElementById('modalCreate').addEventListener('click', () => {
  const date = document.getElementById('modalDate').value;
  const label = document.getElementById('modalLabel').value.trim();
  if (!date || !label) { alert('日付とラベルを入力してください'); return; }

  const snap = currentSnap();
  const newEntries = snap
    ? JSON.parse(JSON.stringify(snap.entries))
    : state.stakeholders.map(sh => ({ stakeholderId: sh.id, impact: 2, influence: 2, attitude: '中立' }));

  const newSnap = { id: 'snap' + Date.now(), date, label, entries: newEntries };
  state.snapshots.push(newSnap);
  state.snapshots.sort((a, b) => a.date.localeCompare(b.date));
  state.currentSnapIndex = state.snapshots.findIndex(s => s.id === newSnap.id);

  document.getElementById('modalOverlay').classList.add('hidden');
  saveState(); renderAll();
});

document.getElementById('deleteSnapshotBtn').addEventListener('click', () => {
  if (state.snapshots.length <= 1) { alert('スナップショットが1つしかないため削除できません'); return; }
  const snap = currentSnap();
  if (!confirm(`「${snap.label}」を削除しますか？`)) return;
  state.snapshots.splice(state.currentSnapIndex, 1);
  state.currentSnapIndex = Math.min(state.currentSnapIndex, state.snapshots.length - 1);
  saveState(); renderAll();
});

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.add('hidden');
});

// ============================================================
// RENDER ALL
// ============================================================
function renderAll() {
  renderControls();
  renderMap();
  renderTable();
  renderSummary();
}

// ============================================================
// INIT
// ============================================================
window.onerror = function(msg, src, line) {
  var el = document.getElementById('js-error');
  if (el) { el.style.display = 'block'; el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')'; }
};

try {
  loadState();
  renderAll();
} catch(e) {
  var el = document.getElementById('js-error');
  if (el) { el.style.display = 'block'; el.textContent = 'Init Error: ' + e.message; }
}
